<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TGP Importer — Pair</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font: 14px/1.45 system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      #hint {
        color: #94a3b8;
        font-size: 13px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        color: #94a3b8;
        font-size: 13px;
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #1e293b;
        border-radius: 6px;
        background: #1e293b;
        color: #f8fafc;
        font: 600 20px/1.45 ui-monospace, monospace;
        letter-spacing: 6px;
        text-align: center;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 9px;
        border: 0;
        border-radius: 6px;
        background: #38bdf8;
        color: #0f172a;
        font: 600 14px/1.45 system-ui, sans-serif;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #error {
        margin-top: 10px;
        color: #f87171;
        font-size: 13px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Pair with TGP</h1>
    <p id="hint">Enter the 6-digit code from your TGP mobile app.</p>
    <form id="pair-form">
      <label for="code">Pairing code</label>
      <input
        id="code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        pattern="\d{6}"
        autofocus
        required
      />
      <button id="submit" type="submit">Pair</button>
    </form>
    <div id="error" hidden></div>
    <script type="module" src="pair.js"></script>
  </body>
</html>

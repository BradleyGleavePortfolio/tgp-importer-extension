<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TGP Importer — Pair</title>
    <style>
      :root {
        --bone: #f7f4ec;
        --cream: #fffdf8;
        --ink: #17251f;
        --forest: #16533c;
        --forest-pressed: #0f432f;
        --muted: #53655b;
        --line: #cbd2c8;
        --error: #7e231b;
        --error-surface: #fbece8;
        --focus-ring: #0f4b37;
        --font-heading: "Cormorant Garamond", ui-serif, Georgia, serif;
        --font-body: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        width: 22.5rem;
        max-width: 100%;
        margin: 0;
        padding: 1.25rem;
        font: 0.9375rem/1.5 var(--font-body);
        background: var(--bone);
        color: var(--ink);
      }
      h1 {
        margin: 0 0 0.5rem;
        font: 600 1.5rem/1.1 var(--font-heading);
        letter-spacing: 0.01em;
      }
      #hint {
        color: var(--muted);
        font-size: 0.9375rem;
        margin: 0 0 1rem;
      }
      label {
        display: block;
        color: var(--ink);
        font-size: 0.875rem;
        font-weight: 700;
        margin: 1rem 0 0.5rem;
      }
      input {
        width: 100%;
        min-height: 3rem;
        padding: 0.625rem 0.75rem;
        border: 1px solid var(--muted);
        border-radius: 0.375rem;
        background: var(--cream);
        color: var(--ink);
        font: 700 1.5rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.2em;
        text-align: center;
      }
      button {
        width: 100%;
        min-height: 3rem;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: var(--forest);
        color: #fff;
        font: 700 0.9375rem/1.45 var(--font-body);
        cursor: pointer;
        transition:
          background-color 160ms ease,
          box-shadow 160ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--forest-pressed);
      }
      button:disabled {
        color: var(--ink);
        background: #aeb9b0;
        cursor: default;
      }
      #error {
        margin-top: 1rem;
        padding: 0.75rem;
        border: 1px solid var(--error);
        border-radius: 0.375rem;
        background: var(--error-surface);
        color: var(--error);
        font-size: 0.875rem;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>Pair with TGP</h1>
    <p id="hint">Enter the 6-digit code from your TGP mobile app.</p>
    <form id="pair-form">
      <label for="code">Pairing code</label>
      <input
        id="code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        pattern="\d{6}"
        autofocus
        required
      />
      <button id="submit" type="submit">Pair</button>
    </form>
    <div id="error" hidden></div>
    <script type="module" src="pair.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TGP Importer</title>
    <style>
      :root {
        --bone: #f7f4ec;
        --cream: #fffdf8;
        --ink: #17251f;
        --forest: #16533c;
        --forest-pressed: #0f432f;
        --muted: #53655b;
        --line: #cbd2c8;
        --error: #7e231b;
        --error-surface: #fbece8;
        --focus-ring: #0f4b37;
        --font-heading: "Cormorant Garamond", ui-serif, Georgia, serif;
        --font-body: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        width: 22.5rem;
        max-width: 100%;
        margin: 0;
        padding: 1.25rem;
        font: 0.9375rem/1.5 var(--font-body);
        background: var(--bone);
        color: var(--ink);
      }
      h1 {
        margin: 0 0 1rem;
        font: 600 1.5rem/1.1 var(--font-heading);
        letter-spacing: 0.01em;
      }
      h2 {
        margin: 0 0 0.75rem;
        font: 600 1.25rem/1.3 var(--font-heading);
      }
      h3 {
        margin: 0 0 0.25rem;
        font: 600 0.875rem/1.3 var(--font-body);
        color: var(--ink);
      }
      p {
        margin: 0.25rem 0;
      }
      #outcome-coverage,
      #outcome-native,
      #outcome-no-receipt {
        color: var(--muted);
        margin: 0.5rem 0;
        font-size: 0.875rem;
      }
      #outcome-guidance {
        margin: 0.75rem 0;
        font-size: 0.875rem;
      }
      .transfer-family {
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--line);
      }
      .transfer-family p {
        font-size: 0.8125rem;
      }
      .transfer-family p + p {
        color: var(--muted);
        font-weight: 600;
      }
      details {
        margin-top: 0.75rem;
        color: var(--muted);
        font-size: 0.875rem;
      }
      summary {
        cursor: pointer;
        padding: 0.5rem 0;
        min-height: 2.75rem;
        display: flex;
        align-items: center;
        color: var(--ink);
        font-weight: 600;
      }
      #intent-id {
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      .actions[hidden] {
        display: none;
      }
      .actions button {
        flex: 1;
        min-height: 2.75rem;
        padding: 0.5rem;
        font: inherit;
        font-weight: 600;
        border: 1px solid var(--muted);
        border-radius: 0.375rem;
        background: var(--cream);
        color: var(--ink);
        cursor: pointer;
        transition: background-color 160ms ease;
      }
      .actions button:hover:not(:disabled) {
        background: var(--bone);
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }
      #action-feedback {
        color: var(--muted);
        font-size: 0.8125rem;
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .row > :last-child {
        min-width: 0;
        text-align: end;
      }
      .label {
        flex: 0 1 auto;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 600;
      }
      .status-created {
        color: var(--ink);
      }
      .status-ingest_started {
        color: var(--forest);
      }
      .status-ingest_succeeded {
        color: var(--forest);
      }
      .status-ingest_partial {
        color: var(--ink);
      }
      .status-ingest_empty {
        color: var(--ink);
      }
      .status-ingest_failed {
        color: var(--error);
      }
      #error {
        margin-top: 1rem;
        padding: 0.75rem;
        border: 1px solid var(--error);
        border-radius: 0.375rem;
        background: var(--error-surface);
        color: var(--error);
        font-size: 0.875rem;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      #empty {
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--cream);
        color: var(--ink);
      }
      progress {
        display: block;
        width: 100%;
        height: 0.5rem;
        margin-top: 0.75rem;
        accent-color: var(--forest);
      }
      #start-import {
        min-height: 3rem;
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        width: 100%;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: var(--forest);
        border: 0;
        border-radius: 0.375rem;
        cursor: pointer;
        transition:
          background-color 160ms ease,
          box-shadow 160ms ease;
      }
      #start-import:hover:not(:disabled) {
        background: var(--forest-pressed);
      }
      #start-import:disabled {
        color: var(--ink);
        background: #aeb9b0;
        cursor: default;
      }
      button:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>TGP Importer</h1>
    <div id="empty">
      Checking previous transfer. Start is paused until status is known.
    </div>
    <div id="detail" hidden>
      <h2 id="status" role="status" aria-live="polite"></h2>
      <div id="progress-list"></div>
      <p id="outcome-no-receipt"></p>
      <p id="outcome-issue"></p>
      <p id="outcome-coverage"></p>
      <p id="outcome-native"></p>
      <p id="outcome-guidance"></p>
      <details>
        <summary data-i18n="outcome_details">Transfer details</summary>
        <div class="row">
          <span class="label">Intent</span><span id="intent-id"></span>
        </div>
        <div class="row">
          <span class="label">Platform</span><span id="platform"></span>
        </div>
      </details>
    </div>
    <div id="outcome-actions" class="actions">
      <button id="check-status" type="button" data-i18n="outcome_check_button">
        Check status
      </button>
      <button
        id="copy-summary"
        type="button"
        data-i18n="outcome_copy_button"
        hidden
      >
        Copy summary
      </button>
    </div>
    <p id="action-feedback" role="status" aria-live="polite"></p>
    <div id="error" role="alert" hidden></div>
    <button id="start-import" type="button" disabled data-outcome-locked="true">
      Start Import
    </button>
    <script type="module" src="popup.js"></script>
  </body>
</html>

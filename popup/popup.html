<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TGP Importer</title>
    <style>
      body {
        width: 340px;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 16px;
        font:
          14px/1.45 system-ui,
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        margin: 4px 0;
      }
      #outcome-coverage,
      #outcome-native,
      #outcome-no-receipt {
        color: #cbd5e1;
        margin: 8px 0;
      }
      #outcome-guidance {
        margin: 12px 0;
      }
      .transfer-family {
        padding: 12px 0;
        border-bottom: 1px solid #334155;
      }
      .transfer-family p {
        font-size: 13px;
      }
      .transfer-family p + p {
        color: #fbbf24;
      }
      details {
        margin-top: 12px;
        color: #cbd5e1;
      }
      summary {
        cursor: pointer;
        padding: 8px 0;
        min-height: 28px;
      }
      #intent-id {
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .actions button {
        flex: 1;
        min-height: 44px;
        padding: 8px;
        font: inherit;
        border: 1px solid #64748b;
        border-radius: 6px;
        background: transparent;
        color: #f8fafc;
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 3px solid #38bdf8;
        outline-offset: 3px;
      }
      #action-feedback {
        color: #cbd5e1;
        font-size: 13px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid #1e293b;
      }
      .label {
        color: #94a3b8;
      }
      .status-created {
        color: #38bdf8;
      }
      .status-ingest_started {
        color: #fbbf24;
      }
      .status-ingest_succeeded {
        color: #22c55e;
      }
      .status-ingest_partial {
        color: #fbbf24;
      }
      .status-ingest_empty {
        color: #fbbf24;
      }
      .status-ingest_failed {
        color: #f87171;
      }
      #error {
        margin-top: 10px;
        color: #f87171;
        font-size: 13px;
        word-break: break-word;
      }
      #empty {
        color: #94a3b8;
      }
      progress {
        width: 100%;
      }
      #start-import {
        margin-top: 12px;
        width: 100%;
        padding: 8px 12px;
        font: inherit;
        color: #0f172a;
        background: #38bdf8;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #start-import:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>TGP Importer</h1>
    <div id="empty">No active import. Start one from TGP.</div>
    <div id="detail" hidden>
      <h2 id="status" role="status" aria-live="polite"></h2>
      <div id="progress-list"></div>
      <p id="outcome-no-receipt"></p>
      <p id="outcome-issue"></p>
      <p id="outcome-coverage"></p>
      <p id="outcome-native"></p>
      <p id="outcome-guidance"></p>
      <div class="actions">
        <button
          id="check-status"
          type="button"
          data-i18n="outcome_check_button"
        >
          Check status
        </button>
        <button id="copy-summary" type="button" data-i18n="outcome_copy_button">
          Copy summary
        </button>
      </div>
      <p id="action-feedback" role="status" aria-live="polite"></p>
      <details>
        <summary data-i18n="outcome_details">Transfer details</summary>
        <div class="row">
          <span class="label">Intent</span><span id="intent-id"></span>
        </div>
        <div class="row">
          <span class="label">Platform</span><span id="platform"></span>
        </div>
      </details>
    </div>
    <div id="error" role="alert" hidden></div>
    <button id="start-import" type="button">Start Import</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff-scoped gates can resolve the merge-base.
          fetch-depth: 0
          # On pull_request, check out the PR head (not the synthetic merge
          # commit). R3 identity + diff gates measure the branch commits only.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Dependency audit (HIGH/CRITICAL block)
        run: npm audit --audit-level=high
      - name: Banned-token net (silent catches + R3 commit identity)
        run: node scripts/check-banned.mjs
      - name: Production LOC budget
        # On pull_request the diff is scoped to the PR base (GITHUB_BASE_REF), so
        # enforce the canonical R23/R76 cap of 400 mechanically at the review gate.
        # On push the base falls back to main, which for a stacked child branch
        # measures the cumulative parent+child diff; keep that at the looser 600 so
        # a legitimately-stacked push is not failed by the parent's lines.
        env:
          PROD_LOC_CAP: ${{ github.event_name == 'pull_request' && '400' || '600' }}
        run: node scripts/check-prod-loc.mjs
      - name: Flag discipline (R109 / NO-DARK-MERGES)
        run: node scripts/check-flag-discipline.mjs
      - name: Enforce R74 test:src >= 2.0 (PR diff)
        run: node scripts/check-test-ratio.mjs
      - name: Production fixture exclusion
        run: node scripts/check-production-fixtures.mjs
      - name: Deploy readiness board
        run: node scripts/check-deploy-readiness.mjs

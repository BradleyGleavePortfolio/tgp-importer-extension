name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Run tests
        run: npm test
      - name: Enforce R74 test:src >= 2.0
        run: node scripts/check-test-ratio.mjs

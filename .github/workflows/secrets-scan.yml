name: Secrets scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed scanner
        run: |
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Prove scanner controls
        run: python3 test/secrets-scan-controls.py "$RUNNER_TEMP/secrets-controls"
      - name: Scan exact PR history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/secrets-scan.sh pr "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/secrets-scan-redacted.json"
      - name: Retain redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-scan-redacted-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/secrets-scan-redacted.json
          if-no-files-found: error
          retention-days: 30
